<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%234f6ef7'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1117;
      color: #e6e8ee;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; }
    p  { font-size: 13px; color: #9aa0ae; word-break: break-all; }
    a  { color: #7c97ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>正在为你跳转… <span id="countdown">5</span>秒</h1>
  <p>如果长时间没有响应，点击这里：<br>
    <a id="jumpLink" href="http://058244d315b9.ofalias.org:54037/">http://058244d315b9.ofalias.org:54037/</a>
  </p>

<script>
const targetUrl = "http://058244d315b9.ofalias.org:54037/";
// sessionStorage：当前标签会话有效；返回页面检测到此标记就不执行自动跳转
const JUMP_FLAG = "has_auto_jumped";

// 如果已经自动跳转过，直接停止逻辑
if(sessionStorage.getItem(JUMP_FLAG)){
  document.querySelector("h1").innerText = "已跳过自动跳转，请手动点击链接访问";
}else{
  let remain = 5;
  const countDom = document.getElementById("countdown");
  const timer = setInterval(()=>{
    remain--;
    countDom.innerText = remain;
    if(remain <= 0){
      clearInterval(timer);
      // 设置标记，下次返回页面不会自动跳
      sessionStorage.setItem(JUMP_FLAG,"1");
      // replace：跳转，不会留下当前页在历史栈，减少返回回到本页的概率
      window.location.replace(targetUrl);
    }
  },1000);
}
</script>
</body>
</html>
