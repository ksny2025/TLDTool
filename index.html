<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%234f6ef7'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1117;
      color: #e6e8ee;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; font-weight: 600; }
    p  { font-size: 15px; color: #9aa0ae; word-break: break-all; line-height: 2; }
    a  { color: #7c97ff; text-decoration: none; display:block; margin:8px 0; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1 id="title">正在为你跳转… <span id="countdown">3</span>秒</h1>
  <p>
    主节点：<a href="http://058244d315b9.ofalias.org:54037/">http://058244d315b9.ofalias.org:54037/</a>
    备用站点：<a href="https://ksny2025.github.io/Znine/">https://ksny2025.github.io/Znine/</a>
  </p>

<script>
const mainUrl = "http://058244d315b9.ofalias.org:54037/";
const backupUrl = "https://ksny2025.github.io/Znine/";
const JUMP_FLAG = "has_auto_jumped";

if(sessionStorage.getItem(JUMP_FLAG)){
  document.getElementById("title").innerText = "自动跳转已结束，请手动点击链接访问";
}else{
  let remain = 3;
  const countDom = document.getElementById("countdown");
  let timer = setInterval(()=>{
    remain--;
    countDom.innerText = remain;
    if(remain <= 0){
      clearInterval(timer);
      sessionStorage.setItem(JUMP_FLAG,"1");
      window.location.replace(backupUrl);
    }
  },1000);

  fetch(mainUrl, {mode:"no-cors"})
  .then(()=>{
    clearInterval(timer);
    sessionStorage.setItem(JUMP_FLAG,"1");
    window.location.replace(mainUrl);
  })
  .catch(()=>{
    // 探测失败，等待倒计时结束，不会立刻跳转
  })
}
</script>
</body>
</html>
