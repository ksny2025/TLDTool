<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号登录</title>
<style>
    :root {
        --bg-base: #101216;
        --bg-card: rgba(24, 30, 44, 0.62);
        --border-soft: rgba(255, 255, 255, 0.07);
        --border-glow: rgba(122, 148, 176, 0.35);
        --accent-cyan: #7a94b0;
        --accent-teal: #7ea09c;
        --text-main: #e8edf5;
        --text-muted: #8b9bb0;
        --text-dim: #6b7a90;
        --radius-lg: 22px;
        --shadow-deep: 0 24px 48px -16px rgba(0, 0, 0, 0.65);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", "微软雅黑", sans-serif; }

    html, body { min-height: 100vh; }

    body {
        background-color: var(--bg-base);
        background-image:
            radial-gradient(circle at 18% 22%, rgba(122, 148, 176, 0.14) 0%, transparent 45%),
            radial-gradient(circle at 82% 70%, rgba(134, 144, 158, 0.12) 0%, transparent 50%),
            radial-gradient(circle at 50% 100%, rgba(126, 160, 156, 0.08) 0%, transparent 55%);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-deep);
        backdrop-filter: blur(18px);
        padding: 30px 30px 24px;
    }

    .brand { margin-bottom: 18px; }
    .brand h1 { font-size: 19px; font-weight: 600; letter-spacing: 0.3px; }
    .brand p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    .tabs {
        display: flex; gap: 4px; padding: 4px; margin-bottom: 20px;
        background: rgba(10, 14, 20, 0.5);
        border: 1px solid var(--border-soft);
        border-radius: 12px;
    }

    .tab {
        flex: 1; height: 34px; border: none; border-radius: 9px;
        background: transparent; color: var(--text-muted);
        font-size: 13.5px; font-weight: 500; cursor: pointer;
        transition: background .18s, color .18s;
    }

    .tab.active { background: rgba(122, 148, 176, 0.18); color: var(--text-main); }

    .field { margin-bottom: 14px; }

    .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 7px; }

    .field input {
        width: 100%; height: 44px; padding: 0 13px;
        background: rgba(10, 14, 20, 0.55);
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: border-color .18s, box-shadow .18s;
    }

    .field input:focus {
        border-color: var(--border-glow);
        box-shadow: 0 0 0 3px rgba(122, 148, 176, 0.12);
    }

    .field input::placeholder { color: var(--text-dim); }

    .pwd { position: relative; }
    .pwd input { padding-right: 60px; }

    .pwd button {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: var(--text-dim);
        font-size: 12px; cursor: pointer; padding: 6px 8px; border-radius: 8px;
    }

    .pwd button:hover { color: var(--text-muted); background: rgba(255,255,255,0.04); }

    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; }

    .code-btn {
        flex: none; height: 44px; padding: 0 14px; border-radius: 12px;
        border: 1px solid var(--border-soft); background: rgba(255,255,255,0.05);
        color: var(--text-main); font-size: 12.5px; cursor: pointer; white-space: nowrap;
    }

    .code-btn:disabled { opacity: .55; cursor: not-allowed; }
    .code-btn:hover:not(:disabled) { border-color: var(--border-glow); }

    .error {
        display: none; font-size: 12.5px; color: #e08c8c;
        background: rgba(224, 140, 140, 0.08);
        border: 1px solid rgba(224, 140, 140, 0.18);
        border-radius: 10px; padding: 9px 12px; margin-bottom: 14px;
        line-height: 1.6;
    }

    .error.show { display: block; }

    .submit {
        width: 100%; height: 45px; border: none; border-radius: 12px;
        background: linear-gradient(120deg, var(--accent-cyan), var(--accent-teal));
        color: #0f1216; font-size: 14.5px; font-weight: 600; letter-spacing: 0.5px;
        cursor: pointer; transition: filter .18s, transform .18s;
    }

    .submit:hover { filter: brightness(1.08); }
    .submit:active { transform: translateY(1px); }
    .submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .foot {
        margin-top: 16px; display: flex; justify-content: center;
        font-size: 12px; color: var(--text-dim);
    }

    .foot a { color: var(--text-muted); text-decoration: none; }
    .foot a:hover { color: var(--accent-cyan); }

    .done { display: none; }
    .done.show { display: block; }

    .done h2 { font-size: 18px; margin-bottom: 8px; }
    .done .hint { font-size: 13px; color: var(--text-muted); line-height: 1.8; margin-bottom: 16px; }

    .acct {
        background: rgba(10, 14, 20, 0.6);
        border: 1px solid var(--border-soft);
        border-radius: 12px; padding: 12px 14px;
        font-size: 13px; color: var(--text-muted); line-height: 1.9;
    }

    .acct b { color: var(--text-main); font-weight: 500; }

    .close-btn {
        width: 100%; height: 42px; margin-top: 16px; border-radius: 12px;
        border: 1px solid var(--border-soft); background: rgba(255,255,255,0.06);
        color: var(--text-main); font-size: 13.5px; cursor: pointer;
    }

    .close-btn:hover { border-color: var(--border-glow); }

    .token-link {
        display: block; margin-top: 14px; text-align: center;
        font-size: 11.5px; color: var(--text-dim); cursor: pointer;
        text-decoration: underline dotted;
    }

    .token-link:hover { color: var(--text-muted); }

    .hidden { display: none !important; }

    @media (max-width: 460px) {
        .card { padding: 24px 18px 20px; }
    }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <h1>账号登录</h1>
        <p id="appName" hidden></p>
    </div>

    <div class="tabs">
        <button type="button" class="tab active" id="tabLogin">登录</button>
        <button type="button" class="tab" id="tabRegister">注册</button>
    </div>

    <div class="error" id="errBox"></div>

    <!-- 登录 -->
    <form id="loginForm">
        <div class="field">
            <label for="loginAccount">邮箱或用户名</label>
            <input id="loginAccount" type="text" placeholder="you@example.com" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="loginPassword">密码</label>
            <div class="pwd">
                <input id="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                <button type="button" data-toggle="loginPassword">显示</button>
            </div>
        </div>
        <button class="submit" id="loginBtn" type="submit">登录</button>
    </form>

    <!-- 注册 -->
    <form id="registerForm" class="hidden">
        <div class="field">
            <label for="regName">用户名</label>
            <input id="regName" type="text" placeholder="最多 20 个字" autocomplete="nickname" required>
        </div>
        <div class="field">
            <label for="regEmail">邮箱</label>
            <input id="regEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="regPassword">密码</label>
            <div class="pwd">
                <input id="regPassword" type="password" placeholder="至少 6 位" autocomplete="new-password" required>
                <button type="button" data-toggle="regPassword">显示</button>
            </div>
        </div>
        <div class="field" id="codeField">
            <label for="regCode">邮箱验证码</label>
            <div class="code-row">
                <input id="regCode" type="text" placeholder="6 位验证码" inputmode="numeric">
                <button type="button" class="code-btn" id="sendCodeBtn">发送验证码</button>
            </div>
        </div>
        <button class="submit" id="registerBtn" type="submit">注册账号</button>
    </form>

    <div class="foot">
        <a href="https://znine.fun/index.html" target="_blank" rel="noopener">返回主站</a>
    </div>

    <div class="done" id="doneBox">
        <h2 id="doneTitle">登录成功</h2>
        <p class="hint" id="doneHint"></p>
        <div class="acct">
            <div>账号：<b id="doneEmail"></b></div>
            <div>用户名：<b id="doneUser"></b></div>
        </div>
        <button type="button" class="close-btn" id="closeBtn">完成，返回软件</button>
        <span class="token-link" id="copyToken">复制登录凭据（开发者）</span>
    </div>
</div>

<script>
(function () {
    var params = new URLSearchParams(location.search);
    var redirect = params.get('redirect') || '';
    var appName = params.get('app') || '';
    var initialMode = params.get('mode') || params.get('tab') || '';

    if (appName) {
        var sub = document.getElementById('appName');
        sub.textContent = appName;
        sub.hidden = false;
        document.title = appName + ' 账号';
    }

    function apiBase() {
        var h = location.hostname;
        if (location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1') {
            return 'http://localhost:18080';
        }
        return 'https://api.znine.fun:54037';
    }

    var errBox = document.getElementById('errBox');
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    var tabLogin = document.getElementById('tabLogin');
    var tabRegister = document.getElementById('tabRegister');

    function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.add('show');
    }

    function clearError() {
        errBox.textContent = '';
        errBox.classList.remove('show');
    }

    function setMode(mode) {
        var reg = mode === 'register';
        tabLogin.classList.toggle('active', !reg);
        tabRegister.classList.toggle('active', reg);
        loginForm.classList.toggle('hidden', reg);
        registerForm.classList.toggle('hidden', !reg);
        clearError();
    }

    tabLogin.addEventListener('click', function () { setMode('login'); });
    tabRegister.addEventListener('click', function () { setMode('register'); });
    if (initialMode === 'register' || initialMode === 'signup') setMode('register');

    document.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.getAttribute('data-toggle'));
            var on = input.type === 'password';
            input.type = on ? 'text' : 'password';
            btn.textContent = on ? '隐藏' : '显示';
        });
    });

    function post(url, body) {
        return fetch(apiBase() + url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        }).then(function (r) {
            return r.json().then(function (d) { return { status: r.status, data: d }; });
        });
    }

    function buildCallback(token, username) {
        var url = new URL(redirect, location.href);
        url.searchParams.set('token', token);
        if (username) url.searchParams.set('username', username);
        return url.toString();
    }

    function finish(kind, data, email, username) {
        var token = data.token || '';
        try { localStorage.setItem('chat_token', token); } catch (e) {}

        if (redirect) {
            if (window.opener) {
                try { window.opener.postMessage({ type: 'tld-login', token: token, username: username }, '*'); } catch (e) {}
            }
            location.replace(buildCallback(token, username));
            return;
        }

        if (window.opener) {
            try { window.opener.postMessage({ type: 'tld-login', token: token, username: username }, '*'); } catch (e) {}
        }

        document.querySelector('.tabs').style.display = 'none';
        loginForm.style.display = 'none';
        registerForm.style.display = 'none';
        document.querySelector('.foot').style.display = 'none';

        document.getElementById('doneTitle').textContent = kind === 'register' ? '注册成功' : '登录成功';
        document.getElementById('doneHint').textContent = kind === 'register'
            ? '账号已创建。回到软件，用上面的邮箱和刚才设置的密码登录即可。'
            : '已登录。回到软件即可继续使用。';
        document.getElementById('doneEmail').textContent = email;
        document.getElementById('doneUser').textContent = username || '-';
        document.getElementById('doneBox').classList.add('show');
        window.__tldToken = token;
    }

    loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();
        var account = document.getElementById('loginAccount').value.trim();
        var password = document.getElementById('loginPassword').value;
        if (!account || !password) { showError('请填写账号和密码'); return; }

        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';

        post('/api/login', { email: account, password: password }).then(function (res) {
            if (!res.data || !res.data.ok) throw new Error((res.data && res.data.error) || '登录失败（HTTP ' + res.status + '）');
            finish('login', res.data, account, res.data.username);
        }).catch(function (err) {
            showError(err.message || '网络错误，请稍后再试');
        }).then(function () {
            btn.disabled = false;
            btn.textContent = '登录';
        });
    });

    var codeSent = 0;
    document.getElementById('sendCodeBtn').addEventListener('click', function () {
        var btn = this;
        var email = document.getElementById('regEmail').value.trim();
        if (!email) { showError('请先填写邮箱'); return; }
        btn.disabled = true;
        post('/api/send_code', { email: email, purpose: 'register' }).then(function (res) {
            if (!res.data || !res.data.ok) throw new Error((res.data && res.data.error) || '发送失败');
            codeSent = 60;
            btn.textContent = '已发送 (60s)';
            var timer = setInterval(function () {
                codeSent--;
                if (codeSent <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '重新发送';
                } else {
                    btn.textContent = '已发送 (' + codeSent + 's)';
                }
            }, 1000);
        }).catch(function (err) {
            showError(err.message);
            btn.disabled = false;
        });
    });

    registerForm.addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var username = document.getElementById('regName').value.trim();
        var email = document.getElementById('regEmail').value.trim().toLowerCase();
        var password = document.getElementById('regPassword').value;
        var code = document.getElementById('regCode').value.trim();

        if (!username) { showError('请填写用户名'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showError('邮箱格式不正确'); return; }
        if (password.length < 6) { showError('密码至少 6 位'); return; }

        var btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = '注册中...';

        post('/api/register', { username: username, email: email, password: password, code: code }).then(function (res) {
            if (!res.data || !res.data.ok) {
                var msg = (res.data && res.data.error) || '注册失败（HTTP ' + res.status + '）';
                if (msg.indexOf('验证码') >= 0) {
                    msg += '。请先点「发送验证码」，把收到的验证码填入后再注册。';
                }
                throw new Error(msg);
            }
            finish('register', res.data, email, res.data.username || username);
        }).catch(function (err) {
            showError(err.message || '网络错误，请稍后再试');
        }).then(function () {
            btn.disabled = false;
            btn.textContent = '注册账号';
        });
    });

    document.getElementById('closeBtn').addEventListener('click', function () {
        window.close();
        setTimeout(function () {
            var hint = document.getElementById('doneHint');
            hint.textContent = '如果窗口没有自动关闭，请手动切回软件。';
        }, 400);
    });

    document.getElementById('copyToken').addEventListener('click', function () {
        var text = window.__tldToken || '';
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        }
        this.textContent = '已复制';
    });
})();
</script>
</body>
</html>
